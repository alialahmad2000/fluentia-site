    <!-- JSON-LD: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "هل أحتاج أكاديمية طلاقة فعلاً؟ ألا توجد طرق مجانية؟",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "نعم، توجد طرق مجانية ممتازة — Duolingo للمفردات، YouTube للاستماع، ChatGPT للممارسة الكتابية. إذا كنت تستطيع التعلّم بنظام بنفسك، الأرجح لا تحتاج طلاقة. الفرق أن طلاقة توفّر الثلاثة معاً: نموذج علمي + ممارسة منظّمة + متابعة شخصية. اختر بناءً على نفسك، لا تحت الضغط."
          }
        },
        {
          "@type": "Question",
          "name": "ليش أدفع أكثر بدل كورس أرخص أو السفر أتعلّم برّا؟",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "لأنك لا تدفع مقابل حصص — تدفع مقابل أن يتولّى فريقٌ كامل مسؤولية وصولك: مدرّب مرّ بفلترٍ صعب، منهج مبني على حالتك أنت، متابعة يومية، ومنصة تقيس تقدّمك. الكورس الأرخص يعطيك مادة ثم ينساك؛ والسفر بلا متابعة كثيراً ما يرجع بصاحبه دون تطوّرٍ حقيقي. الفرق هنا أن هناك من يتابعك — ويصحّح المسار معك أسبوعاً بأسبوع. إن كانت البدائل المجانية تكفيك، فهذا قرارك المحترم."
          }
        },
        {
          "@type": "Question",
          "name": "لماذا الأسعار بهذا الشكل؟",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "السعر يغطّي تكلفة حقيقية: مدرّب مؤهَّل ومتفرّغ، منصة LMS كاملة، تكلفة تقييم الـ AI الفعلية (Whisper + Claude)، تطوير المنهج، والمتابعة الشخصية اليومية. لا رمزٌ للجودة، ولا قطعٌ للزاوية — وكل باقة تبدأ بمحادثة مجانية حتى تتأكد قبل أن تدفع. إذا كان السعر أكثر مما تستطيع، فهذا قرارك المحترم."
          }
        },
        {
          "@type": "Question",
          "name": "هل تضمنون نتيجة؟",
